name: Build desktop package (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the Linux .deb package
        run: npx nx package cabscribe-desktop --output-style=static
      - uses: actions/upload-artifact@v4
        with:
          name: cabscribe-linux-deb
          path: dist/packages/*.deb
          if-no-files-found: error
