name: Test (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint, test and build
        run: npx nx run-many -t lint,test,build --projects=cabscribe,common --output-style=static
      - name: Lint desktop shell
        run: npx nx lint cabscribe-desktop --output-style=static
