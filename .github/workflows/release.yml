name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/_test.yml
  desktop:
    needs: test
    uses: ./.github/workflows/_build-desktop.yml
  deploy-web:
    needs: test
    uses: ./.github/workflows/_deploy-web.yml
    secrets: inherit
  github-release:
    needs: [desktop, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cabscribe-linux-deb
          path: packages
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.deb --repo "$GITHUB_REPOSITORY" --title "CabScribe $GITHUB_REF_NAME" --generate-notes
